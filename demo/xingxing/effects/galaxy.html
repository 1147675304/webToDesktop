<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>粒子星系</title>
    <link rel="stylesheet" href="../bridge.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { cursor: none; user-select: none; -webkit-user-select: none; }
        body {
            width: 100vw; height: 100vh; overflow: hidden;
            background: transparent; display: flex;
            justify-content: center; align-items: center;
            pointer-events: none;
        }
        canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; }
    </style>
</head>
<body>
    <canvas id="c"></canvas>

    <script src="../bridge.js"></script>
    <script src="../passthrough.js"></script>
    <script>
        // ★ 效果页面是纯视觉叠加层，启用输入穿透让鼠标事件到达下层窗口
        initBridge({ inputPassthrough: true, ready: startAnimation });

        function startAnimation() {
            var canvas = document.getElementById('c');
            var ctx = canvas.getContext('2d');
            var W, H;

            function resize() {
                W = window.innerWidth;
                H = window.innerHeight;
                canvas.width = W;
                canvas.height = H;
            }
            resize();
            window.addEventListener('resize', resize);

            // 鼠标交互（桌面模式不显示光标，但仍可跟踪位置）
            var mouse = { x: W / 2, y: H / 2 };
            document.addEventListener('mousemove', function(e) { mouse.x = e.clientX; mouse.y = e.clientY; });

            // 粒子
            var particles = [];
            var NUM = 180;

            function randomPalette() {
                var palettes = [
                    { a: '#ff6b6b', b: '#feca57', c: '#48dbfb', d: '#ff9ff3' },
                    { a: '#00d2ff', b: '#3a7bd5', c: '#6c5ce7', d: '#a29bfe' },
                    { a: '#f093fb', b: '#f5576c', c: '#4facfe', d: '#43e97b' },
                    { a: '#fa709a', b: '#fee140', c: '#00f2fe', d: '#4facfe' }
                ];
                return palettes[Math.floor(Math.random() * palettes.length)];
            }

            var colors = randomPalette();

            function Particle() {
                this.reset();
            }
            Particle.prototype.reset = function() {
                var angle = Math.random() * Math.PI * 2;
                var radius = 50 + Math.random() * Math.min(W, H) * 0.45;
                this.baseX = W / 2 + Math.cos(angle) * radius;
                this.baseY = H / 2 + Math.sin(angle) * radius;
                this.x = this.baseX;
                this.y = this.baseY;
                this.vx = 0;
                this.vy = 0;
                this.size = 1.5 + Math.random() * 2.5;
                var ci = Math.floor(Math.random() * 4);
                var c = [colors.a, colors.b, colors.c, colors.d][ci];
                this.color = c;
                this.orbitAngle = angle;
                this.orbitSpeed = (0.002 + Math.random() * 0.008) * (Math.random() > 0.5 ? 1 : -1);
                this.orbitRadius = radius;
                this.z = Math.random() * 10;
            };

            for (var i = 0; i < NUM; i++) {
                particles.push(new Particle());
            }

            var _frame = 0;
            function loop() {
                _frame++;
                ctx.clearRect(0, 0, W, H);

                // 更新粒子位置 - 向鼠标吸引
                for (var i = 0; i < particles.length; i++) {
                    var p = particles[i];
                    p.orbitAngle += p.orbitSpeed;
                    p.baseX = W / 2 + Math.cos(p.orbitAngle) * p.orbitRadius;
                    p.baseY = H / 2 + Math.sin(p.orbitAngle) * p.orbitRadius;

                    var dx = mouse.x - p.baseX;
                    var dy = mouse.y - p.baseY;
                    var dist = Math.sqrt(dx * dx + dy * dy);
                    var force = Math.max(0, 1 - dist / 300) * 0.3;

                    p.vx += dx * force * 0.01;
                    p.vy += dy * force * 0.01;
                    p.vx *= 0.95;
                    p.vy *= 0.95;
                    p.x = p.baseX + p.vx;
                    p.y = p.baseY + p.vy;
                }

                // 绘制连线（相邻粒子距离近时连线）
                for (var i = 0; i < particles.length; i++) {
                    var p1 = particles[i];
                    for (var j = i + 1; j < particles.length; j++) {
                        var p2 = particles[j];
                        var dx = p1.x - p2.x;
                        var dy = p1.y - p2.y;
                        var dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < 120) {
                            var alpha = (1 - dist / 120) * 0.5;
                            ctx.strokeStyle = 'rgba(255,255,255,' + alpha + ')';
                            ctx.lineWidth = 0.5;
                            ctx.beginPath();
                            ctx.moveTo(p1.x, p1.y);
                            ctx.lineTo(p2.x, p2.y);
                            ctx.stroke();
                        }
                    }
                }

                // 绘制粒子
                for (var i = 0; i < particles.length; i++) {
                    var p = particles[i];
                    var alpha = 0.6 + Math.sin(Date.now() * 0.002 + i) * 0.3;
                    ctx.globalAlpha = alpha;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();

                    // 光晕
                    ctx.globalAlpha = alpha * 0.3;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size * 3, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.globalAlpha = 1;
                }

                requestAnimationFrame(loop);
            }
            loop();
        }
    </script>
</body>
</html>
