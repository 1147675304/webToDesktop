<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星空</title>
    <link rel="stylesheet" href="../bridge.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { cursor: none; user-select: none; -webkit-user-select: none; }
        body {
            width: 100vw; height: 100vh; overflow: hidden;
            background: transparent;
            display: flex; justify-content: center; align-items: center;
            pointer-events: none;
        }

        #stars-canvas {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%; z-index: 0;
            pointer-events: none;
        }

        .shooting-star {
            position: fixed; width: 2px; height: 2px;
            background: white; border-radius: 50%;
            z-index: 2; pointer-events: none;
        }
    </style>
</head>
<body>
    <canvas id="stars-canvas"></canvas>

    <script src="../bridge.js"></script>
    <script src="../passthrough.js"></script>
    <script>
        // ★ 效果页面是纯视觉叠加层，启用输入穿透
        initBridge({ inputPassthrough: true, ready: startAnimation });

        function startAnimation() {
            var canvas = document.getElementById('stars-canvas');
            var ctx = canvas.getContext('2d');
            var W, H;
            var stars = [];
            var meteors = [];
            var N = 1200;
            var tick = 0;

            function resize() {
                var dpr = window.devicePixelRatio || 1;
                W = window.innerWidth;
                H = window.innerHeight;
                canvas.width = W * dpr;
                canvas.height = H * dpr;
                canvas.style.width = W + 'px';
                canvas.style.height = H + 'px';
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            }

            function Star(init) {
                this.x = Math.random() * W;
                this.y = init ? Math.random() * H : -5;
                var r = Math.random();
                if (r < 0.01) this.r = 4.5;
                else if (r < 0.05) this.r = 3;
                else if (r < 0.20) this.r = 2;
                else this.r = 1.5;
                // 漂移速度：大星慢，小星快，模拟视差
                var baseSpeed = 0.015 + Math.random() * 0.12;
                var ang = Math.random() * Math.PI * 2;
                this.vx = Math.cos(ang) * baseSpeed;
                this.vy = Math.sin(ang) * baseSpeed;
                var cr = Math.random();
                if (cr < 0.04) this.color = '150,190,255';        // O/B型 蓝白高温星
                else if (cr < 0.12) this.color = '200,220,255';     // A型 淡蓝白
                else if (cr < 0.28) this.color = '255,250,240';     // F型 奶白
                else if (cr < 0.48) this.color = '255,242,210';     // G型 暖黄（类太阳）
                else if (cr < 0.64) this.color = '255,220,160';     // K型 橙色
                else if (cr < 0.78) this.color = '255,190,130';     // K型 深橙
                else if (cr < 0.88) this.color = '255,160,110';     // M型 橙红
                else if (cr < 0.95) this.color = '255,210,180';     // 淡橙
                else this.color = '255,240,230';                    // 暖白
                this.a = this.ba = 0.35 + Math.random() * 0.65;
                this.p1 = Math.random() * Math.PI * 2;
                this.f1 = 0.004 + Math.random() * 0.025;
                this.m1 = 0.04 + Math.random() * 0.16;
                this.p2 = Math.random() * Math.PI * 2;
                this.f2 = this.f1 * (2.3 + Math.random() * 4);
                this.m2 = this.m1 * 0.45;
            }
            Star.prototype.update = function(t) {
                // 漂移
                this.x += this.vx; this.y += this.vy;
                if (this.x < -20) this.x = W + 20;
                if (this.x > W + 20) this.x = -20;
                if (this.y < -20) this.y = H + 20;
                if (this.y > H + 20) this.y = -20;
                // 闪烁
                this.a = this.ba + Math.sin(t * this.f1 + this.p1) * this.m1 + Math.sin(t * this.f2 + this.p2) * this.m2;
                this.a = Math.max(0.05, Math.min(1, this.a));
            };
            Star.prototype.draw = function() {
                ctx.fillStyle = 'rgba(' + this.color + ',' + this.a.toFixed(2) + ')';
                ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2); ctx.fill();
            };

            function BrightStar() { Star.call(this); this.r = 3 + Math.random() * 3; this.ba = 0.7 + Math.random() * 0.3; this.a = this.ba; this.glowR = this.r * 2.5; }
            BrightStar.prototype = Object.create(Star.prototype);
            BrightStar.prototype.draw = function() {
                var g = ctx.createRadialGradient(this.x, this.y, this.r * 0.3, this.x, this.y, this.glowR);
                g.addColorStop(0, 'rgba(' + this.color + ',' + (this.a * 0.55).toFixed(2) + ')');
                g.addColorStop(1, 'rgba(255,255,255,0)');
                ctx.fillStyle = g; ctx.beginPath(); ctx.arc(this.x, this.y, this.glowR, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = 'rgba(' + this.color + ',' + this.a.toFixed(2) + ')';
                ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2); ctx.fill();
            };

            function Meteor(init) {
                this.x = Math.random() * W * 0.7;
                this.y = init ? Math.random() * H * 0.3 : -15;
                this.len = 60 + Math.random() * 80;
                this.spd = 5 + Math.random() * 6;
                this.ang = 0.6 + Math.random() * 0.7;
                this.life = 0;
                this.max = 35 + Math.random() * 40;
                this.a = 0;
                this.vx = Math.cos(this.ang) * this.spd;
                this.vy = Math.sin(this.ang) * this.spd;
            }
            Meteor.prototype.update = function() {
                this.x += this.vx; this.y += this.vy; this.life++;
                if (this.life < 5) this.a = this.life / 5;
                else if (this.life > this.max - 10) this.a = Math.max(0, (this.max - this.life) / 10);
                else this.a = 1;
                if (this.life >= this.max || this.x > W + 150 || this.y > H + 150) { this.x = Math.random() * W * 0.7; this.y = -15; this.life = 0; this.a = 0; this.vx = Math.cos(this.ang) * this.spd; this.vy = Math.sin(this.ang) * this.spd; }
            };
            Meteor.prototype.draw = function() {
                if (this.a <= 0) return;
                var tx = this.x - Math.cos(this.ang) * this.len;
                var ty = this.y - Math.sin(this.ang) * this.len;
                var grd = ctx.createLinearGradient(this.x, this.y, tx, ty);
                grd.addColorStop(0, 'rgba(255,255,255,' + this.a + ')');
                grd.addColorStop(1, 'rgba(255,255,255,0)');
                ctx.strokeStyle = grd; ctx.lineWidth = 1.8;
                ctx.beginPath(); ctx.moveTo(this.x, this.y); ctx.lineTo(tx, ty); ctx.stroke();
                ctx.fillStyle = 'rgba(255,255,255,' + this.a + ')';
                ctx.beginPath(); ctx.arc(this.x, this.y, 1.8, 0, Math.PI * 2); ctx.fill();
            };

            function initStars() {
                stars.length = 0;
                for (var i = 0; i < N; i++) stars.push(i < N * 0.03 ? new BrightStar(true) : new Star(true));
            }

            resize();
            initStars();

            function loop() {
                tick++;
                ctx.clearRect(0, 0, W, H);
                for (var i = 0; i < stars.length; i++) { stars[i].update(tick); stars[i].draw(); }
                if (meteors.length < 3 && Math.random() < 0.004) meteors.push(new Meteor(true));
                for (var j = meteors.length - 1; j >= 0; j--) { meteors[j].update(); meteors[j].draw(); }

                requestAnimationFrame(loop);
            }
            loop();

            window.addEventListener('resize', function() { resize(); initStars(); });
        }
    </script>
</body>
</html>
