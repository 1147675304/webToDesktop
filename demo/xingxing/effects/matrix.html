<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>矩阵数字雨</title>
    <link rel="stylesheet" href="../bridge.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { cursor: none; user-select: none; -webkit-user-select: none; }
        body {
            width: 100vw; height: 100vh; overflow: hidden;
            background: transparent; display: flex;
            justify-content: center; align-items: center;
            pointer-events: none;
        }
        canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; }
    </style>
</head>
<body>
    <canvas id="c"></canvas>

    <script src="../bridge.js"></script>
    <script src="../passthrough.js"></script>
    <script>
        // ★ 效果页面是纯视觉叠加层，启用输入穿透让鼠标事件到达下层窗口
        initBridge({ inputPassthrough: true, ready: startAnimation });

        function startAnimation() {
            var canvas = document.getElementById('c');
            var ctx = canvas.getContext('2d');
            var W, H;

            function resize() {
                var dpr = window.devicePixelRatio || 1;
                W = window.innerWidth;
                H = window.innerHeight;
                canvas.width = W * dpr;
                canvas.height = H * dpr;
                canvas.style.width = W + 'px';
                canvas.style.height = H + 'px';
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            }
            resize();

            var chars = '0123456789';

            var fontSize = 20;
            var columns = 0;
            var drops = [];   // { y, speed, len, pattern:[], delay, active }

            function initDrops() {
                columns = Math.floor(W / fontSize);
                drops.length = 0;
                for (var i = 0; i < columns; i++) {
                    var active = Math.random() < 0.35;
                    // 每列固定 1~4 个字符循环，下落过程中字符不变
                    var pat = [];
                    var plen = 1 + Math.floor(Math.random() * 4);
                    for (var k = 0; k < plen; k++) {
                        pat.push(chars[Math.floor(Math.random() * chars.length)]);
                    }
                    drops.push({
                        y: -(Math.random() * H * 2),
                        speed: 0.8 + Math.random() * 1.8,
                        len: 3 + Math.floor(Math.random() * 7),
                        pattern: pat,
                        delay: active ? Math.floor(Math.random() * 80) : 99999,
                        active: active
                    });
                }
            }
            initDrops();

            function loop() {
                // 透明背景：不清屏则拖尾，清屏则清爽
                ctx.clearRect(0, 0, W, H);

                ctx.font = 'bold ' + fontSize + 'px monospace';
                ctx.textBaseline = 'top';

                for (var i = 0; i < drops.length; i++) {
                    var d = drops[i];
                    if (d.delay > 0) { d.delay--; continue; }

                    d.y += d.speed;

                    // 每列固定 pattern 循环，下落时字符不变
                    for (var t = d.len - 1; t >= 0; t--) {
                        var charY = d.y - t * fontSize;
                        if (charY < -fontSize || charY > H + fontSize) continue;

                        // 从 pattern 中按位置取字符，循环重复
                        var ch = d.pattern[t % d.pattern.length];

                        var ratio = t / Math.max(1, d.len - 1);
                        if (t === 0) {
                            ctx.fillStyle = 'rgba(180,255,180,0.8)';
                        } else if (t <= 1) {
                            ctx.fillStyle = 'rgba(60,220,60,0.55)';
                        } else {
                            var a = Math.max(0.06, (1 - ratio) * 0.4);
                            ctx.fillStyle = 'rgba(0,160,0,' + a.toFixed(2) + ')';
                        }

                        ctx.fillText(ch, i * fontSize, charY);
                    }

                    if (d.y - d.len * fontSize > H) {
                        d.y = -d.len * fontSize - Math.random() * 120;
                        d.speed = 0.8 + Math.random() * 1.8;
                        d.len = 3 + Math.floor(Math.random() * 7);
                        d.delay = Math.floor(Math.random() * 60);
                        // 刷新 pattern
                        d.pattern.length = 0;
                        var plen = 1 + Math.floor(Math.random() * 4);
                        for (var k = 0; k < plen; k++) {
                            d.pattern.push(chars[Math.floor(Math.random() * chars.length)]);
                        }
                    }
                }

                requestAnimationFrame(loop);
            }

            loop();

            window.addEventListener('resize', function() {
                resize();
                initDrops();
            });
        }
    </script>
</body>
</html>
