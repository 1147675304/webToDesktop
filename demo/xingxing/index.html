<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebToDesktop 效果启动器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { user-select: none; -webkit-user-select: none; }
        body {
            width: 100vw; height: 100vh; overflow: hidden;
            background: rgba(0,0,0,0.85);
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            font-family: 'Arial', sans-serif;
            padding: 20px;
        }
        h1 {
            color: #fff; font-size: 28px; margin-bottom: 8px;
            letter-spacing: 2px;
        }
        .subtitle {
            color: rgba(255,255,255,0.4); font-size: 14px;
            margin-bottom: 32px;
        }
        .effect-grid {
            display: flex; flex-wrap: wrap; gap: 16px;
            justify-content: center; max-width: 600px;
        }
        .effect-card {
            width: 260px; padding: 24px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            text-decoration: none; color: #fff;
            transition: background 0.15s, border-color 0.15s;
            cursor: pointer;
        }
        .effect-card:hover {
            background: rgba(255,255,255,0.08);
            border-color: rgba(255,255,255,0.25);
        }
        .effect-card h3 { font-size: 18px; margin-bottom: 6px; }
        .effect-card p { font-size: 13px; color: rgba(255,255,255,0.5); line-height: 1.5; }
        .effect-card .tag {
            display: inline-block; padding: 2px 8px;
            border-radius: 4px; font-size: 11px;
            background: rgba(255,255,255,0.08);
            color: rgba(255,255,255,0.4);
            margin-top: 10px;
        }

        /* 星空画布 */
        #stars-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            /* 画布本身透明，星星叠加在页面底层 */
        }

        /* 太阳系容器 */
        .solar-system {
            position: relative;
            width: 1200px;
            height: 1200px;
            z-index: 1;
        }

        /* 太阳 */
        .sun {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 120px;
            height: 120px;
            margin-left: -60px;
            margin-top: -60px;
            background: radial-gradient(circle, #fff7a0 0%, #ffcc00 30%, #ff8800 60%, #ff4400 100%);
            border-radius: 50%;
            box-shadow:
                0 0 90px #ffaa00,
                0 0 180px #ff6600,
                0 0 270px #ff4400,
                0 0 360px #ff3300,
                0 0 450px #ff2200;
            z-index: 10;
            animation: sunPulse 2s ease-in-out infinite alternate;
        }

        @keyframes sunPulse {
            0% {
                box-shadow: 0 0 90px #ffaa00, 0 0 180px #ff6600, 0 0 270px #ff4400, 0 0 360px #ff3300, 0 0 450px #ff2200;
            }
            100% {
                box-shadow: 0 0 120px #ffbb33, 0 0 225px #ff8833, 0 0 330px #ff5533, 0 0 420px #ff4422, 0 0 525px #ff3311;
            }
        }

        /* 轨道 */
        .orbit {
            position: absolute;
            top: 50%;
            left: 50%;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        /* 每颗行星的轨道旋转层 */
        .planet-spin {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
        }

        /* 行星通用样式 */
        .planet {
            position: absolute;
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }

        /* 行星名字标签 */
        .planet-name {
            position: absolute;
            width: 90px;
            text-align: center;
            color: rgba(255, 255, 255, 0.8);
            font-size: 15px;
            font-family: 'Arial', sans-serif;
            pointer-events: none;
            white-space: nowrap;
            transform: translate(-50%, -50%);
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
        }

        /* ========== 水星 ========== */
        .orbit-mercury { width: 150px; height: 150px; }
        .spin-mercury { animation: spin 3s linear infinite; }
        .planet-mercury {
            width: 12px;
            height: 12px;
            background: radial-gradient(circle at 30% 30%, #d4d4d4, #8a8a8a);
            top: 75px;
            left: 0;
        }

        /* ========== 金星 ========== */
        .orbit-venus { width: 225px; height: 225px; }
        .spin-venus { animation: spin 5s linear infinite; }
        .planet-venus {
            width: 21px;
            height: 21px;
            background: radial-gradient(circle at 30% 30%, #f5d57a, #c4953a);
            top: 112px;
            left: 0;
        }

        /* ========== 地球 ========== */
        .orbit-earth { width: 315px; height: 315px; }
        .spin-earth { animation: spin 8s linear infinite; }
        .planet-earth {
            width: 22px;
            height: 22px;
            background: radial-gradient(circle at 30% 30%, #6bb5ff, #2266cc);
            top: 158px;
            left: 0;
        }

        /* 月球 */
        .moon-orbit {
            position: absolute;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            animation: moonSpin 2.5s linear infinite;
        }
        .moon {
            position: absolute;
            width: 6px;
            height: 6px;
            background: #ddd;
            border-radius: 50%;
            top: 21px;
            left: 0;
            transform: translate(-50%, -50%);
        }

        @keyframes moonSpin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* ========== 火星 ========== */
        .orbit-mars { width: 420px; height: 420px; }
        .spin-mars { animation: spin 12s linear infinite; }
        .planet-mars {
            width: 16px;
            height: 16px;
            background: radial-gradient(circle at 30% 30%, #e8784a, #993311);
            top: 210px;
            left: 0;
        }

        /* ========== 木星 ========== */
        .orbit-jupiter { width: 570px; height: 570px; }
        .spin-jupiter { animation: spin 20s linear infinite; }
        .planet-jupiter {
            width: 60px;
            height: 60px;
            background: radial-gradient(circle at 40% 40%, #f0d8a8, #c8a45c, #a08048);
            top: 285px;
            left: 0;
            box-shadow: 0 0 12px rgba(200, 164, 92, 0.5);
        }
        /* 木星条纹 */
        .jupiter-stripes {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 9%,
                rgba(180, 130, 60, 0.4) 9%,
                rgba(180, 130, 60, 0.4) 13%
            );
            top: 0;
            left: 0;
        }

        /* ========== 土星 ========== */
        .orbit-saturn { width: 720px; height: 720px; }
        .spin-saturn { animation: spin 30s linear infinite; }
        .planet-saturn {
            width: 51px;
            height: 51px;
            background: radial-gradient(circle at 40% 40%, #f5e6b8, #d4b870);
            top: 360px;
            left: 0;
        }
        /* 土星光环 */
        .saturn-ring {
            position: absolute;
            width: 80px;
            height: 24px;
            border-radius: 50%;
            border: 6px solid rgba(210, 180, 120, 0.7);
            border-top-color: rgba(210, 180, 120, 0.3);
            border-bottom-color: rgba(180, 150, 100, 0.9);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotateX(75deg);
            pointer-events: none;
        }

        /* ========== 天王星 ========== */
        .orbit-uranus { width: 855px; height: 855px; }
        .spin-uranus { animation: spin 45s linear infinite; }
        .planet-uranus {
            width: 39px;
            height: 39px;
            background: radial-gradient(circle at 40% 40%, #c8f0f8, #5bbbd4);
            top: 428px;
            left: 0;
        }

        /* ========== 海王星 ========== */
        .orbit-neptune { width: 975px; height: 975px; }
        .spin-neptune { animation: spin 60s linear infinite; }
        .planet-neptune {
            width: 37px;
            height: 37px;
            background: radial-gradient(circle at 40% 40%, #6088ff, #2233aa);
            top: 488px;
            left: 0;
        }

        /* ========== 冥王星 ========== */
        .orbit-pluto { width: 1080px; height: 1080px; }
        .spin-pluto { animation: spin 80s linear infinite; }
        .planet-pluto {
            width: 10px;
            height: 10px;
            background: radial-gradient(circle at 30% 30%, #e8d8c8, #9a8a78);
            top: 540px;
            left: 0;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* 流星 */
        .shooting-star {
            position: fixed;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            z-index: 2;
            pointer-events: none;
        }


    </style>
</head>
<body>
    <h1>🎨 WebToDesktop</h1>
    <p class="subtitle">选择一个演示效果</p>

    <div class="effect-grid">
        <a class="effect-card" href="effects/solar-system.html">
            <h3>🌌 太阳系行星</h3>
            <p>九大行星环绕太阳运行，带星空背景和流星效果的沉浸式动画</p>
            <span class="tag">Canvas 动画</span>
        </a>
        <a class="effect-card" href="effects/galaxy.html">
            <h3>✨ 粒子星系</h3>
            <p>彩色粒子在引力场中旋转变幻，鼠标移动产生扰动，粒子间距离近时连线形成星云</p>
            <span class="tag">粒子系统</span>
        </a>
        <a class="effect-card" href="effects/aurora.html">
            <h3>🌌 极光</h3>
            <p>多层动态极光在夜空中流淌，星光闪烁，地面树木剪影，色彩变幻的极光帷幕</p>
            <span class="tag">渐变着色</span>
        </a>
        <a class="effect-card" href="effects/matrix.html">
            <h3>💚 矩阵数字雨</h3>
            <p>经典绿色数字雨效果，日文假名 + ASCII 字符纵向坠落，头部高亮拖尾渐暗</p>
            <span class="tag">经典复刻</span>
        </a>
    </div>

    <script src="bridge.js"></script>
    <script>
        initBridge();
    </script>
</body>
</html>
