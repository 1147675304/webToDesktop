# ============================================================
# WebToDesktop 构建配置文件
# 构建时通过 embed 嵌入二进制，运行时无需此文件
# ============================================================

# ———— 应用基本信息 ————
app:
  name: "WebToDesktop"
  version: "1.0.0"

# ———— 安全配置 ————
security:
  # AES-256 加密密钥（任意字符串，构建时自动 SHA256 派生为 32 字节密钥）
  # ★ 开源用户必须修改此密钥！修改后旧的 credentials.dat 将无法解密
  aes_key: "lhpanda-webtodesktop-2026"

# ============================================================
# 窗口配置
# ============================================================
# ★ borderless=true 时前端需适配：拖拽条、resize 手柄、窗口控制按钮
window:
  title: "后台管理系统"
  width: 1366
  height: 768

  # ———— 窗口状态（优先级: fullscreen > maximized > 普通） ————
  fullscreen: true         # 全屏（覆盖整个显示器含任务栏）
  maximized: false         # 最大化（保留任务栏）
                           # 两者均为 false → 普通窗口（width × height）

  # ———— 窗口外观 ————
  borderless: true         # 无边框窗口（隐藏标题栏）
  always_on_top: true      # 窗口始终置顶
  opacity: 0.99            # 不透明度 (0.0=全透明, 1.0=不透明)
  window_position: "center" # 窗口位置: ""=系统决定 / "center"=居中 / "x,y"=绝对坐标

  # WebView 背景透明（实验性，仅 GNOME/KDE 测试通过）
  webview_bg_transparent: true

  # 透明区域点击穿透
  # ★ Windows: WS_EX_TRANSPARENT 使整个窗口穿透，可通过 bridge.setInputPassthrough 动态切换
  input_passthrough: true

  # ———— 系统托盘 ————
  system_tray: true        # 关闭窗口 → 隐藏到托盘而非退出
  tray_hide_taskbar: true  # 托盘模式下隐藏任务栏图标（仅 Windows）

  # ———— 键盘控制 ————
  keyboard_shortcuts: true  # 键盘钩子总开关（关闭后按键映射和组合快捷键注册均失效）

  # 禁用 WebView 浏览器内置快捷键（JS 注入，仅影响当前应用）
  # 禁用: Ctrl+S（保存网页）、Ctrl+P（打印）、Ctrl+U（查看源码）、F12（开发者工具）
  disable_browser_shortcuts: true

  # 默认拦截的快捷键（全局钩子，仅 keyboard_shortcuts=true 时生效）
  # 被拦截的按键不会传递到系统任何应用，可通过 bridge API 动态调整
  default_blocked_shortcuts: []

  # 按键映射：物理键名 → 自定义名（通过 bridge.setKeyMapping 动态管理）
  # 映射修饰键可一次性禁用该键的所有系统组合（如映射 Super_L 后 Win+D/R/E 全部失效）
  key_mappings:
    Super_L: "Win"
    Super_R: "Win"
    Alt_L: "Alt"
    Alt_R: "Alt"
    Control_L: "Ctrl"
    Control_R: "Ctrl"

  # ———— Windows 专属 ————
  dark_title_bar: true     # 暗色标题栏（Win10 1809+）
  round_corners: true      # 圆角窗口（Win11）
  acrylic: true            # Acrylic 毛玻璃背景

# ============================================================
# 可构建的前端项目列表
# 每个项目在自身的 .env.production 中配置 VITE_REMOTE_API_URL 等
# ============================================================
projects:
  - name: "doc"
    vue_dir: "demo/doc"
    description: "WebToDesktop 文档"
  - name: "serial"
    vue_dir: "demo/serial"
    description: "串口调试工具"
  - name: "myapp"
    vue_dir: "myapp"
    description: "hello"
  - name: "xx"
    vue_dir: "demo/xingxing"
    description: "hello"
    external_html: true    # 外挂 HTML 模式：文件复制到 web/ 目录，不嵌入二进制
